<!DOCTYPE html>
<html>
<head>
  <title>Live Streaming Demo</title>
</head>
<body>

<h2>Instagram Live Demo</h2>

<button onclick="startLive()">Go Live</button>
<button onclick="joinLive()">Join Live</button>

<p id="status">Not Live</p>
<p>Viewers: <span id="viewers">0</span></p>

<h3>Broadcaster Preview</h3>
<video id="localVideo" autoplay muted playsinline width="400"></video>

<h3>Viewer Player</h3>
<video id="remoteVideo" autoplay playsinline width="400"></video>

<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io();
let localStream;
let peerConnections = {};
let isBroadcaster = false;

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

const status = document.getElementById("status");
const viewers = document.getElementById("viewers");

function createPeerConnection(targetId) {
  const pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      socket.emit("ice-candidate", {
        target: targetId,
        candidate: event.candidate
      });
    }
  };

  pc.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
  };

  return pc;
}

// 🎥 Start Live
async function startLive() {
  isBroadcaster = true;

  localStream = await navigator.mediaDevices.getUserMedia({
    video: true,
    audio: true
  });

  localVideo.srcObject = localStream;
  socket.emit("start-live");
}

socket.on("new-viewer", async (viewerId) => {
  const pc = createPeerConnection(viewerId);
  peerConnections[viewerId] = pc;

  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  socket.emit("offer", {
    target: viewerId,
    offer
  });
});

// 👀 Join Live
function joinLive() {
  socket.emit("join-live");
  socket.emit("viewer-joined");
} 
socket.on("offer", async ({ from, offer }) => {
  const pc = createPeerConnection(from);
  peerConnections[from] = pc;

  await pc.setRemoteDescription(new RTCSessionDescription(offer));

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  socket.emit("answer", {
    target: from,
    answer
  });
});

socket.on("answer", async ({ from, answer }) => {
  await peerConnections[from].setRemoteDescription(
    new RTCSessionDescription(answer)
  );
});

socket.on("ice-candidate", async ({ from, candidate }) => {
  if (peerConnections[from]) {
    await peerConnections[from].addIceCandidate(
      new RTCIceCandidate(candidate)
    );
  }
});

socket.on("live-started", () => {
  status.innerText = "LIVE 🔴";
});

socket.on("viewer-count", (count) => {
  viewers.innerText = count;
});

socket.on("live-stopped", () => {
  status.innerText = "Not Live";
});

</script>

</body>
</html>
